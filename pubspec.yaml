name: cml_si_buying
description: CML SI Buying enterprise Flutter application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  go_router: ^16.2.0
  path_provider: ^2.1.5
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  flutter_svg: ^2.3.2
  connectivity_plus: ^7.3.2
  file_picker: ^13.3.2
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  webview_flutter: ^4.14.1
  printing: ^5.15.1
  pdf: ^3.13.1

dev_dependencies:
  # integration_test:
  #   sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/icons/
    - assets/images/
    - assets/fonts/AlikeAngular-OFL.txt
    - assets/fonts/Poppins-OFL.txt
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Alike Angular
      fonts:
        - asset: assets/fonts/AlikeAngular-Regular.ttf
          weight: 400
